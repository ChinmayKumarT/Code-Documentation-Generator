<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Code Documentation Generator</title>
    <link rel="icon" href="/static/favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1><i class="fas fa-file-code"></i> Code Documentation Generator</h1>
            <p>Generate beautiful documentation for your code with a single click</p>
        </header>
        
        <div class="tabs">
            <button class="tab-btn active" data-tab="file-upload">
                <i class="fas fa-upload"></i> Upload File
            </button>
            <button class="tab-btn" data-tab="paste-code">
                <i class="fas fa-paste"></i> Paste Code
            </button>
        </div>

        <main>
            <!-- File Upload Section -->
            <div id="file-upload" class="tab-content active">
                <div class="upload-section">
                    <div class="file-upload-area">
                        <i class="fas fa-cloud-upload-alt"></i>
                        <p>Drag & drop your code file here or</p>
                        <input type="file" id="file-input">
                        <label for="file-input" class="file-label">
                            <span>Browse Files</span>
                        </label>
                        <div id="file-name" class="file-name"></div>
                    </div>
                    <button id="upload-button" class="action-button">
                        <i class="fas fa-magic"></i> Generate Documentation
                    </button>
                </div>
            </div>

            <!-- Code Paste Section -->
            <div id="paste-code" class="tab-content">
                <div class="code-paste-section">
                    <div class="code-editor">
                        <div class="editor-header">
                            <span class="language-selector">
                                <i class="fas fa-code"></i>
                                <select id="language-select">
                                    <option value="python">Python</option>
                                    <option value="javascript">JavaScript</option>
                                    <option value="java">Java</option>
                                    <option value="c">C</option>
                                    <option value="cpp">C++</option>
                                </select>
                            </span>
                            <button id="copy-code" class="icon-button" title="Copy to clipboard">
                                <i class="far fa-copy"></i>
                            </button>
                        </div>
                        <textarea id="code-input" placeholder="Paste your code here..."></textarea>
                    </div>
                    <button id="generate-from-code" class="action-button">
                        <i class="fas fa-magic"></i> Generate Documentation
                    </button>
                </div>
            </div>

            <!-- Results Section -->
            <section id="results-section" class="results-section">
                <!-- Results will be inserted here by JavaScript -->
            </section>

            <!-- Loading Overlay -->
            <div id="loading-overlay" class="loading-overlay">
                <div class="loading-content">
                    <div class="loading-spinner"></div>
                    <div class="loading-text">Generating documentation...</div>
                </div>
            </div>
            <div id="error-message" class="error-message"></div>
        </main>
    </div>
    <script src="/static/script.js"></script>
</body>
</html>
